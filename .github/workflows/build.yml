name: Build Android APK (Chaquopy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install imagemagick and ffmpeg tools
        run: sudo apt-get install -y imagemagick

      - name: Create placeholder icon
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert -size 72x72 xc:#00A884 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 96x96 xc:#00A884 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 144x144 xc:#00A884 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 192x192 xc:#00A884 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Download ffmpeg for Android arm64
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          wget --tries=3 "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz" -O ffmpeg.tar.xz
          tar -xJf ffmpeg.tar.xz
          find . -name "ffmpeg" -not -name "ffmpeg-*" -type f
          FFMPEG=$(find . -name "ffmpeg" -not -name "ffmpeg-*" -type f | head -1)
          cp "$FFMPEG" app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          echo "ffmpeg size: $(wc -c < app/src/main/jniLibs/arm64-v8a/libffmpeg.so) bytes"

      - name: Build Debug APK
        run: gradle assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveMonitor-Chaquopy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
