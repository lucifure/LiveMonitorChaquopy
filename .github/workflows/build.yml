name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Ensure launcher icons exist
        run: |
          test -f icon.png
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Verify requested feature files
        run: |
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -f app/src/main/java/com/livemonitor/app/YouTubeUrlUtils.java
          grep -q 'delete.setText("Delete")' app/src/main/java/com/livemonitor/app/ChannelAdapter.java
          grep -q 'deleteButton.setText("Delete")' app/src/main/java/com/livemonitor/app/RecordingAdapter.java
          grep -q 'buildDebugSummary' app/src/main/java/com/livemonitor/app/RemoteConfig.java
          grep -q 'markFetchedNow' app/src/main/java/com/livemonitor/app/RemoteConfig.java
          grep -q 'ACTION_DOWNLOAD_VIDEO' app/src/main/java/com/livemonitor/app/LiveMonitorActions.java

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveMonitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
