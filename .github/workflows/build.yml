name: Build Android APK (Chaquopy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install tools
        run: sudo apt-get install -y imagemagick wget xz-utils

      - name: Create placeholder icon
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert -size 72x72 xc:#00A884 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 96x96 xc:#00A884 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 144x144 xc:#00A884 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 192x192 xc:#00A884 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Download ffmpeg for Android arm64
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a

          echo "Trying ffmpeg-kit release..."
          wget -q "https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-full-6.0-android-arm64-v8a.aar" -O ffmpeg-kit.aar || true

          if [ -f ffmpeg-kit.aar ] && [ $(wc -c < ffmpeg-kit.aar) -gt 100000 ]; then
            echo "Extracting from ffmpeg-kit AAR..."
            unzip -o ffmpeg-kit.aar "jni/arm64-v8a/libffmpeg.so" -d aar-extracted || true
            if [ -f aar-extracted/jni/arm64-v8a/libffmpeg.so ]; then
              cp aar-extracted/jni/arm64-v8a/libffmpeg.so app/src/main/jniLibs/arm64-v8a/libffmpeg.so
              echo "SUCCESS from ffmpeg-kit AAR"
            fi
          fi

          if [ ! -f app/src/main/jniLibs/arm64-v8a/libffmpeg.so ] || [ $(wc -c < app/src/main/jniLibs/arm64-v8a/libffmpeg.so) -lt 100000 ]; then
            echo "Trying android-ffmpeg-binary..."
            wget -q "https://github.com/kn007/silk-v3-decoder/raw/master/ffmpeg" -O /tmp/ffmpeg_test || true
            curl -sL "https://raw.githubusercontent.com/nicholasess/android-ffmpeg-binary/master/binary/arm64-v8a/ffmpeg" -o app/src/main/jniLibs/arm64-v8a/libffmpeg.so || true
          fi

          if [ ! -f app/src/main/jniLibs/arm64-v8a/libffmpeg.so ] || [ $(wc -c < app/src/main/jniLibs/arm64-v8a/libffmpeg.so) -lt 100000 ]; then
            echo "Trying mobile-ffmpeg..."
            wget -q "https://github.com/tanersener/mobile-ffmpeg/releases/download/v4.4/mobile-ffmpeg-full-4.4-android-arm64-v8a.aar" -O mobile-ffmpeg.aar || true
            if [ -f mobile-ffmpeg.aar ] && [ $(wc -c < mobile-ffmpeg.aar) -gt 100000 ]; then
              unzip -o mobile-ffmpeg.aar "jni/arm64-v8a/libffmpeg.so" -d mf-extracted || true
              if [ -f mf-extracted/jni/arm64-v8a/libffmpeg.so ]; then
                cp mf-extracted/jni/arm64-v8a/libffmpeg.so app/src/main/jniLibs/arm64-v8a/libffmpeg.so
                echo "SUCCESS from mobile-ffmpeg AAR"
              fi
            fi
          fi

          echo "Final ffmpeg check:"
          ls -la app/src/main/jniLibs/arm64-v8a/
          echo "Size: $(wc -c < app/src/main/jniLibs/arm64-v8a/libffmpeg.so 2>/dev/null || echo 0) bytes"

      - name: Build Debug APK
        run: gradle assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveMonitor-Chaquopy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
