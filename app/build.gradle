plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.livemonitor.app'

    defaultConfig {
        applicationId "com.livemonitor.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { minifyEnabled false; debuggable true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding true }

    sourceSets {
        main {
            // Android extracts files named lib*.so from jniLibs into nativeLibraryDir,
            // which is executable by com.livemonitor.app even for background services.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libyt-dlp.so']
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    // Personal/private testing: youtubedl-android 0.18.1+ bundles Android Python, yt-dlp, ffmpeg, and QuickJS.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.webkit:webkit:1.12.1'

    // HTTP
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'

    // FFmpegKit maintained Maven Central fork.
    implementation 'com.mrljdx:ffmpeg-kit-full:6.1.4'
}

tasks.register('generateLauncherPngs') {
    description = 'Generates launcher PNG files by resizing the checked-in Logo.png before Android resource processing.'
    inputs.file rootProject.file('Logo.png')
    outputs.dir file('src/main/res')
    outputs.upToDateWhen { false }

    doLast {
        def sourceLogo = rootProject.file('Logo.png')
        if (!sourceLogo.isFile()) {
            throw new GradleException("Launcher logo source not found: ${sourceLogo}")
        }

        def densities = [
                'mipmap-mdpi'   : 48,
                'mipmap-hdpi'   : 72,
                'mipmap-xhdpi'  : 96,
                'mipmap-xxhdpi' : 144,
                'mipmap-xxxhdpi': 192,
        ]

        densities.each { folder, size ->
            def dir = file("src/main/res/${folder}")
            dir.mkdirs()
            writeLauncherPng(sourceLogo, new File(dir, 'ic_launcher.png'), size)
            writeLauncherPng(sourceLogo, new File(dir, 'ic_launcher_round.png'), size)
        }
    }
}

def writeLauncherPng(File sourceFile, File outputFile, int size) {
    def source = javax.imageio.ImageIO.read(sourceFile)
    if (source == null) {
        throw new GradleException("Unable to read launcher logo source image: ${sourceFile}")
    }

    def image = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
    def graphics = image.createGraphics()
    graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
    graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
    graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)

    // Resize Logo.png directly into the launcher canvas. This keeps the PR text-only while
    // letting CI/build machines generate the binary launcher PNGs locally before packaging.
    graphics.drawImage(source, 0, 0, size, size, null)
    graphics.dispose()

    javax.imageio.ImageIO.write(image, 'png', outputFile)
}

tasks.configureEach { task ->
    if (task.name == 'preBuild' || task.name.startsWith('merge') || task.name.startsWith('process') || task.name.startsWith('lint')) {
        task.dependsOn tasks.named('generateLauncherPngs')
    }
}
