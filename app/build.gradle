plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.livemonitor.app'

    defaultConfig {
        applicationId "com.livemonitor.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { minifyEnabled false; debuggable true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding true }

    sourceSets {
        main {
            // Android extracts files named lib*.so from jniLibs into nativeLibraryDir,
            // which is executable by com.livemonitor.app even for background services.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libyt-dlp.so']
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Personal/private testing: bundles Android Python + yt-dlp through youtubedl-android.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.0'

    // HTTP
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'

    // FFmpegKit maintained Maven Central fork.
    implementation 'com.mrljdx:ffmpeg-kit-full:6.1.4'
}
